<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miresol Block Coding</title>
    <!-- Google Blockly CDN -->
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
    <script src="https://unpkg.com/blockly/msg/ko.js"></script>
    <!-- avrgirl-arduino Browser Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/avrgirl-arduino@5.2.0/dist/avrgirl-arduino.browser.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Noto Sans KR', sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
        }
        header {
            height: 50px;
            background-color: #003366;
            color: white;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 100;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-container img {
            height: 32px;
            width: auto;
        }
        .logo-container h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 6px 14px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.85rem;
        }
        .btn-upload {
            background-color: #28a745;
            color: white;
        }
        .btn-upload:hover {
            background-color: #218838;
        }
        .btn-code {
            background-color: #17a2b8;
            color: white;
        }
        .btn-code:hover {
            background-color: #138496;
        }
        #main-container {
            position: relative;
            width: 100vw;
            height: calc(100vh - 50px);
            display: flex;
        }
        #blocklyArea {
            position: relative;
            flex: 1;
            height: 100%;
        }
        #blocklyDiv {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        #codeContainer {
            width: 350px;
            height: 100%;
            background-color: #1e1e1e;
            color: #d4d4d4;
            display: flex;
            flex-direction: column;
            border-left: 2px solid #333;
            z-index: 10;
        }
        #codeHeader {
            background-color: #252526;
            padding: 10px 15px;
            font-weight: bold;
            font-size: 0.85rem;
            color: #9cdcfe;
            border-bottom: 1px solid #333;
        }
        #codeArea {
            flex: 1;
            padding: 15px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.85rem;
            white-space: pre;
            overflow-y: auto;
            color: #dcdcaa;
        }
        #statusArea {
            padding: 8px 15px;
            background-color: #007acc;
            color: white;
            font-size: 0.8rem;
        }
        /* Blockly Flyout z-index 보정 */
        .blocklyFlyout {
            z-index: 50 !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="log.png" alt="Miresol Logo" onerror="this.style.display='none'">
            <h1>Miresol Block Platform</h1>
        </div>
        <div class="btn-group">
            <button class="btn-code" onclick="toggleCodePanel()">코드 보기/숨기기</button>
            <button class="btn-upload" onclick="compileAndUpload()">보드에 업로드 🚀</button>
        </div>
    </header>

    <div id="main-container">
        <div id="blocklyArea">
            <div id="blocklyDiv"></div>
        </div>
        <div id="codeContainer">
            <div id="codeHeader">Generated Arduino C++ Code</div>
            <div id="codeArea">// 블록을 조립하면 코드가 여기에 생성됩니다.</div>
            <div id="statusArea">상태: 대기 중</div>
        </div>
    </div>

    <!-- Blockly 툴박스 정의 -->
    <xml id="toolbox" style="display: none">
        <category name="입출력 (GPIO)" colour="#5C81A6">
            <block type="digital_write"></block>
            <block type="digital_read"></block>
            <block type="analog_write"></block>
            <block type="analog_read"></block>
        </category>
        <category name="시간 (Delay)" colour="#5CA68D">
            <block type="delay_ms"></block>
        </category>
        <category name="시리얼 통신" colour="#A65C81">
            <block type="serial_begin"></block>
            <block type="serial_print"></block>
        </category>
        <category name="제어 (Loops)" colour="#5BA55B">
            <block type="controls_repeat_ext">
                <value name="TIMES">
                    <shadow type="math_number"><field name="NUM">10</field></shadow>
                </value>
            </block>
            <block type="controls_whileUntil"></block>
        </category>
        <category name="수학 (Math)" colour="#5B67A5">
            <block type="math_number"><field name="NUM">0</field></block>
        </category>
    </xml>

    <script>
        const BACKEND_API_URL = 'https://miresol-backend.onrender.com/api/compile';

        // 1. 커스텀 블록 정의
        Blockly.Blocks['digital_write'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField("디지털 핀 ")
                    .appendField(new Blockly.FieldDropdown([["13", "13"], ["12", "12"], ["11", "11"], ["10", "10"], ["9", "9"], ["8", "8"]]), "PIN")
                    .appendField("번 출력 ")
                    .appendField(new Blockly.FieldDropdown([["HIGH (켜기)", "HIGH"], ["LOW (끄기)", "LOW"]]), "STATE");
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour(210);
            }
        };

        Blockly.Blocks['delay_ms'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField(new Blockly.FieldNumber(1000, 0), "TIME")
                    .appendField("밀리초(ms) 대기");
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour(160);
            }
        };

        Blockly.Blocks['serial_begin'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField("시리얼 통신 시작 (속도: ")
                    .appendField(new Blockly.FieldDropdown([["9600", "9600"], ["115200", "115200"]]), "BAUD")
                    .appendField(")");
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour(300);
            }
        };

        Blockly.Blocks['serial_print'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField("시리얼 모니터 출력:")
                    .appendField(new Blockly.FieldTextInput("Hello Miresol!"), "TEXT");
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour(300);
            }
        };

        // 2. C++ 코드 생성기 규칙 정의
        const ArduinoCode = new Blockly.Generator('Arduino');
        ArduinoCode.ORDER_ATOMIC = 0;

        ArduinoCode['digital_write'] = function(block) {
            const pin = block.getFieldValue('PIN');
            const state = block.getFieldValue('STATE');
            return `pinMode(${pin}, OUTPUT);\ndigitalWrite(${pin}, ${state});\n`;
        };

        ArduinoCode['delay_ms'] = function(block) {
            const time = block.getFieldValue('TIME');
            return `delay(${time});\n`;
        };

        ArduinoCode['serial_begin'] = function(block) {
            const baud = block.getFieldValue('BAUD');
            return `Serial.begin(${baud});\n`;
        };

        ArduinoCode['serial_print'] = function(block) {
            const text = block.getFieldValue('TEXT');
            return `Serial.println("${text}");\n`;
        };

        ArduinoCode.scrub_ = function(block, code) {
            const nextBlock = block.nextConnection && block.nextConnection.targetBlock();
            return code + ArduinoCode.blockToCode(nextBlock);
        };

        // 3. Blockly 워크스페이스 주입 및 리사이즈 처리
        const blocklyArea = document.getElementById('blocklyArea');
        const blocklyDiv = document.getElementById('blocklyDiv');

        const workspace = Blockly.inject(blocklyDiv, {
            toolbox: document.getElementById('toolbox'),
            scrollbars: true,
            zoom: { controls: true, wheel: true }
        });

        const onresize = function() {
            let element = blocklyArea;
            let x = 0;
            let y = 0;
            do {
                x += element.offsetLeft;
                y += element.offsetTop;
                element = element.offsetParent;
            } while (element);
            blocklyDiv.style.left = x + 'px';
            blocklyDiv.style.top = y + 'px';
            blocklyDiv.style.width = blocklyArea.offsetWidth + 'px';
            blocklyDiv.style.height = blocklyArea.offsetHeight + 'px';
            Blockly.svgResize(workspace);
        };

        window.addEventListener('resize', onresize, false);
        onresize();

        // 4. 실시간 C++ 코드 업데이트
        function updateGeneratedCode() {
            const blocksCode = ArduinoCode.workspaceToCode(workspace);
            const fullCode = `#include <Arduino.h>\n\nvoid setup() {\n${blocksCode}}\n\nvoid loop() {\n  // 반복 실행할 코드\n}\n`;
            document.getElementById('codeArea').textContent = fullCode;
            return fullCode;
        }

        workspace.addChangeListener(updateGeneratedCode);

        // UI 제어
        function updateStatus(msg) {
            document.getElementById('statusArea').textContent = "상태: " + msg;
        }

        function toggleCodePanel() {
            const panel = document.getElementById('codeContainer');
            if (panel.style.display === 'none') {
                panel.style.display = 'flex';
            } else {
                panel.style.display = 'none';
            }
            onresize(); // 패널 토글 시 화면 크기 재계산
        }

        // 5. 서버 컴파일 및 보드 업로드
        async function compileAndUpload() {
            const code = updateGeneratedCode();
            updateStatus("클라우드 서버에 컴파일 요청 중...");

            try {
                const response = await fetch(BACKEND_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, board: 'arduino:avr:uno' })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || "컴파일 실패");
                }

                updateStatus("HEX 바이너리 수신 완료! 웹 시리얼 업로드 시작...");
                const hexArrayBuffer = await response.arrayBuffer();

                const avrgirl = new AvrgirlArduino({
                    board: 'uno',
                    debug: true
                });

                avrgirl.flash(hexArrayBuffer, (err) => {
                    if (err) {
                        console.error(err);
                        updateStatus("업로드 실패: " + err.message);
                    } else {
                        updateStatus("업로드 성공! 🎉 보드가 재부팅됩니다.");
                    }
                });

            } catch (err) {
                console.error(err);
                updateStatus("에러 발생: " + err.message);
            }
        }
    </script>
</body>
</html>
